# Replace the image digest, management IP and every /mnt/tank/... path.
services:
  iscsi-reset-api:
    image: ghcr.io/REPLACE_OWNER/iscsi-reset-service@sha256:REPLACE_WITH_IMMUTABLE_DIGEST
    command: ["serve-reset"]
    network_mode: host
    user: "10001:10001"
    read_only: true
    restart: unless-stopped
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      SERVICE_ROLE: reset
      BACKEND: truenas
      CONFIG_PATH: /config/config.yaml
      RELEASE_DB_PATH: /state/releases.sqlite3
      TOKEN_PEPPER_FILE: /run/secrets/token_pepper
      TRUENAS_API_URL: wss://127.0.0.1/api/current
      TRUENAS_API_USERNAME: iscsi-reset-service
      TRUENAS_API_KEY_FILE: /run/secrets/truenas_api_key
      TRUENAS_TLS_VERIFY: "false"
      TRUENAS_TLS_INSECURE_ACK: I_ACCEPT_MITM_RISK
      BIND_HOST: 10.20.40.10
      BIND_PORT: "8443"
      SERVER_CERT_FILE: /run/tls/server.crt
      SERVER_KEY_FILE: /run/tls/server.key
      LOG_LEVEL: INFO
    volumes:
      - /mnt/tank/iscsi-reset/config.yaml:/config/config.yaml:ro
      - /mnt/tank/iscsi-reset/state:/state:ro
      - /mnt/tank/iscsi-reset/secrets/token_pepper:/run/secrets/token_pepper:ro
      - /mnt/tank/iscsi-reset/secrets/truenas_api_key:/run/secrets/truenas_api_key:ro
      - /mnt/tank/iscsi-reset/tls/reset-server.crt:/run/tls/server.crt:ro
      - /mnt/tank/iscsi-reset/tls/reset-server.key:/run/tls/server.key:ro
    tmpfs:
      - /tmp:size=16m,mode=1777

  iscsi-release-admin:
    image: ghcr.io/REPLACE_OWNER/iscsi-reset-service@sha256:REPLACE_WITH_IMMUTABLE_DIGEST
    command: ["serve-admin"]
    network_mode: host
    user: "10001:10001"
    read_only: true
    restart: unless-stopped
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      SERVICE_ROLE: admin
      BACKEND: truenas
      CONFIG_PATH: /config/config.yaml
      RELEASE_DB_PATH: /state/releases.sqlite3
      TOKEN_PEPPER_FILE: /run/secrets/token_pepper
      ADMIN_TOKEN_PEPPER_FILE: /run/secrets/admin_token_pepper
      TRUENAS_API_URL: wss://127.0.0.1/api/current
      TRUENAS_API_USERNAME: iscsi-reset-service
      TRUENAS_API_KEY_FILE: /run/secrets/truenas_api_key
      TRUENAS_TLS_VERIFY: "false"
      TRUENAS_TLS_INSECURE_ACK: I_ACCEPT_MITM_RISK
      ADMIN_BIND_HOST: REPLACE_WITH_TRUENAS_MANAGEMENT_IP
      ADMIN_BIND_PORT: "8444"
      SERVER_CERT_FILE: /run/tls/server.crt
      SERVER_KEY_FILE: /run/tls/server.key
      ADMIN_CLIENT_CA_FILE: /run/tls/client-ca.crt
      LOG_LEVEL: INFO
    volumes:
      - /mnt/tank/iscsi-reset/config.yaml:/config/config.yaml:ro
      - /mnt/tank/iscsi-reset/state:/state:rw
      - /mnt/tank/iscsi-reset/secrets/token_pepper:/run/secrets/token_pepper:ro
      - /mnt/tank/iscsi-reset/secrets/admin_token_pepper:/run/secrets/admin_token_pepper:ro
      - /mnt/tank/iscsi-reset/secrets/truenas_api_key:/run/secrets/truenas_api_key:ro
      - /mnt/tank/iscsi-reset/tls/admin-server.crt:/run/tls/server.crt:ro
      - /mnt/tank/iscsi-reset/tls/admin-server.key:/run/tls/server.key:ro
      - /mnt/tank/iscsi-reset/tls/admin-client-ca.crt:/run/tls/client-ca.crt:ro
    tmpfs:
      - /tmp:size=16m,mode=1777
