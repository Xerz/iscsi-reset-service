# Replace the image digest, management IP and every /mnt/tank/... path.
services:
  iscsi-reset-api:
    image: ghcr.io/REPLACE_OWNER/iscsi-reset-service@sha256:REPLACE_WITH_IMMUTABLE_DIGEST
    command: ["serve-reset"]
    network_mode: host
    user: "10001:10001"
    read_only: true
    restart: unless-stopped
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      SERVICE_ROLE: reset
      BACKEND: truenas
      CONFIG_PATH: /config/config.yaml
      RELEASE_DB_PATH: /state/releases.sqlite3
      TOKEN_PEPPER_FILE: /run/secrets/token_pepper
      TRUENAS_API_URL: wss://REPLACE_WITH_TRUENAS_MANAGEMENT_IP/api/current
      TRUENAS_API_USERNAME: iscsi-reset-service
      TRUENAS_API_KEY_FILE: /run/secrets/truenas_api_key
      TRUENAS_TLS_VERIFY: "false"
      TRUENAS_TLS_INSECURE_ACK: I_ACCEPT_MITM_RISK
      BIND_HOST: 10.20.40.10
      BIND_PORT: "8443"
      SERVER_CERT_FILE: /run/tls/server.crt
      SERVER_KEY_FILE: /run/tls/server.key
      LOG_LEVEL: INFO
    volumes:
      - /mnt/tank/iscsi-reset/config:/config:ro
      - /mnt/tank/iscsi-reset/state:/state:ro
      - /mnt/tank/iscsi-reset/secrets/token_pepper:/run/secrets/token_pepper:ro
      - /mnt/tank/iscsi-reset/secrets/truenas_api_key:/run/secrets/truenas_api_key:ro
      - /mnt/tank/iscsi-reset/tls/reset-server.crt:/run/tls/server.crt:ro
      - /mnt/tank/iscsi-reset/tls/reset-server.key:/run/tls/server.key:ro
    tmpfs:
      - /tmp:size=16m,mode=1777

  iscsi-reset-management:
    image: ghcr.io/REPLACE_OWNER/iscsi-reset-service@sha256:REPLACE_WITH_IMMUTABLE_DIGEST
    command: ["serve-management"]
    network_mode: host
    user: "10001:10001"
    read_only: true
    restart: unless-stopped
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      MANAGEMENT_BACKEND: truenas
      CONFIG_PATH: /config/config.yaml
      RELEASE_DB_PATH: /state/releases.sqlite3
      TOKEN_PEPPER_FILE: /run/secrets/token_pepper
      MANAGEMENT_TOKEN_PEPPER_FILE: /run/secrets/management_token_pepper
      MANAGEMENT_TOKEN_DIGEST_FILE: /run/secrets/management_token_digest
      TRUENAS_API_URL: wss://REPLACE_WITH_TRUENAS_MANAGEMENT_IP/api/current
      TRUENAS_API_USERNAME: iscsi-reset-service
      TRUENAS_API_KEY_FILE: /run/secrets/truenas_api_key
      TRUENAS_DISCOVERY_API_USERNAME: iscsi-reset-discovery
      TRUENAS_DISCOVERY_API_KEY_FILE: /run/secrets/truenas_discovery_api_key
      TRUENAS_TLS_VERIFY: "false"
      TRUENAS_TLS_INSECURE_ACK: I_ACCEPT_MITM_RISK
      MANAGEMENT_BIND_HOST: 127.0.0.1
      MANAGEMENT_BIND_PORT: "8445"
      LOG_LEVEL: INFO
    volumes:
      - /mnt/tank/iscsi-reset/config:/config:rw
      - /mnt/tank/iscsi-reset/state:/state:rw
      - /mnt/tank/iscsi-reset/secrets/token_pepper:/run/secrets/token_pepper:ro
      - /mnt/tank/iscsi-reset/secrets/management_token_pepper:/run/secrets/management_token_pepper:ro
      - /mnt/tank/iscsi-reset/secrets/management_token_digest:/run/secrets/management_token_digest:ro
      - /mnt/tank/iscsi-reset/secrets/truenas_api_key:/run/secrets/truenas_api_key:ro
      - /mnt/tank/iscsi-reset/secrets/truenas_discovery_api_key:/run/secrets/truenas_discovery_api_key:ro
    tmpfs:
      - /tmp:size=16m,mode=1777
