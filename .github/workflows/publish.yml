name: Publish GHCR image and TrueNAS bundle

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      image_repository: ${{ steps.release.outputs.image_repository }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: release
        name: Validate tag and image repository
        shell: bash
        run: |
          version="$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match project version v${version}" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "Release workflow requires a tag ref" >&2
            exit 1
          fi
          tag_type="$(git cat-file -t "${GITHUB_REF}" 2>/dev/null || true)"
          if [[ "${tag_type}" != "tag" ]]; then
            echo "Tag ${GITHUB_REF_NAME} must be annotated" >&2
            exit 1
          fi
          tag_body="$(git for-each-ref --format='%(contents)' "${GITHUB_REF}")"
          if [[ ! "${tag_body}" =~ [^[:space:]] ]]; then
            echo "Annotated tag ${GITHUB_REF_NAME} must contain release highlights" >&2
            exit 1
          fi
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image_repository=ghcr.io/${owner}/iscsi-reset-service" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  verification:
    needs: validate
    uses: ./.github/workflows/verify.yml

  publish:
    needs: [validate, verification]
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
      packages: write
    env:
      BUNDLE_NAME: iscsi-reset-service-${{ github.ref_name }}-truenas.yaml
      IMAGE_REPOSITORY: ${{ needs.validate.outputs.image_repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_REPOSITORY }}
          tags: type=raw,value=${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
      - id: push
        name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          sbom: true
      - name: Attest image provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.IMAGE_REPOSITORY }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Render and validate TrueNAS bundle
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
          PYTHONPATH: src
        shell: bash
        run: |
          python -m iscsi_reset_service.release_bundle \
            --template truenas/custom-app.yaml \
            --output "dist/${BUNDLE_NAME}" \
            --image-repository "${IMAGE_REPOSITORY}" \
            --digest "${IMAGE_DIGEST}"
          printf '%s\n' "${IMAGE_REPOSITORY}@${IMAGE_DIGEST}" > dist/image-digest.txt
          install -m 0644 powershell/*.ps1 dist/
          docker compose -f "dist/${BUNDLE_NAME}" config --quiet
          cd dist
          sha256sum "${BUNDLE_NAME}" image-digest.txt *.ps1 > SHA256SUMS
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: iscsi-reset-service-${{ github.ref_name }}-truenas
          path: |
            dist/${{ env.BUNDLE_NAME }}
            dist/image-digest.txt
            dist/SHA256SUMS
            dist/*.ps1
          if-no-files-found: error
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        shell: bash
        run: |
          current_commit="$(git rev-list -n 1 "${GITHUB_REF_NAME}")"
          previous_tag="$(
            git tag --merged "${current_commit}" --sort=-version:refname |
              awk -v current="${GITHUB_REF_NAME}" \
                '$0 ~ /^v[0-9]+\.[0-9]+\.[0-9]+$/ && $0 != current { print; exit }'
          )"
          if [[ -z "${previous_tag}" ]]; then
            echo "No previous semver tag found in ${GITHUB_REF_NAME} history" >&2
            exit 1
          fi

          {
            printf '%s\n\n' "## Что нового"
            git for-each-ref --format='%(contents)' "refs/tags/${GITHUB_REF_NAME}"
            printf '\n%s\n\n' "## Коммиты"
            while IFS=$'\t' read -r sha subject; do
              short_sha="${sha:0:7}"
              printf -- '- [`%s`](%s/%s/commit/%s) %s\n' \
                "${short_sha}" "${GITHUB_SERVER_URL}" "${GITHUB_REPOSITORY}" "${sha}" "${subject}"
            done < <(git log --reverse --format='%H%x09%s' "${previous_tag}..${current_commit}")
            printf '\n%s\n\n' "## Комплект выпуска"
            printf '%s\n' \
              "Контейнер: ${IMAGE_REPOSITORY}@${IMAGE_DIGEST}" \
              "" \
              "Скачайте все семь приложенных файлов в один каталог и выполните: \`sha256sum --check SHA256SUMS\`." \
              "Файл \`${BUNDLE_NAME}\` содержит неизменяемый digest образа; перед установкой замените management IP и пути \`/mnt/tank\` для своей системы." \
              "Файл \`image-digest.txt\` содержит полную ссылку на тот же образ, а \`SHA256SUMS\` проверяет YAML, digest-файл и четыре PowerShell-скрипта." \
              "" \
              "Publisher: \`Install-IscsiReleasePublisher.ps1\` и \`Publish-IscsiRelease.ps1\`. Файл \`publisher.json\` скачивается из Management UI своей установки." \
              "Клиент: \`Install-IscsiResetClient.ps1\` и \`Reset-And-Connect.ps1\`."
          } > dist/release-notes.md
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" \
              --title "iSCSI Reset Service ${GITHUB_REF_NAME}" \
              --notes-file dist/release-notes.md
            gh release upload "${GITHUB_REF_NAME}" \
              "dist/${BUNDLE_NAME}" dist/image-digest.txt dist/SHA256SUMS dist/*.ps1 --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              "dist/${BUNDLE_NAME}" dist/image-digest.txt dist/SHA256SUMS dist/*.ps1 \
              --verify-tag \
              --title "iSCSI Reset Service ${GITHUB_REF_NAME}" \
              --notes-file dist/release-notes.md
          fi
