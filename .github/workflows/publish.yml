name: Publish GHCR image and TrueNAS bundle

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      image_repository: ${{ steps.release.outputs.image_repository }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: release
        name: Validate tag and image repository
        shell: bash
        run: |
          version="$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match project version v${version}" >&2
            exit 1
          fi
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image_repository=ghcr.io/${owner}/iscsi-reset-service" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  verification:
    needs: validate
    uses: ./.github/workflows/verify.yml

  publish:
    needs: [validate, verification]
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
      packages: write
    env:
      BUNDLE_NAME: iscsi-reset-service-${{ github.ref_name }}-truenas.yaml
      IMAGE_REPOSITORY: ${{ needs.validate.outputs.image_repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_REPOSITORY }}
          tags: type=raw,value=${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
      - id: push
        name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          sbom: true
      - name: Attest image provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.IMAGE_REPOSITORY }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Render and validate TrueNAS bundle
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
          PYTHONPATH: src
        shell: bash
        run: |
          python -m iscsi_reset_service.release_bundle \
            --template truenas/custom-app.yaml \
            --output "dist/${BUNDLE_NAME}" \
            --image-repository "${IMAGE_REPOSITORY}" \
            --digest "${IMAGE_DIGEST}"
          printf '%s\n' "${IMAGE_REPOSITORY}@${IMAGE_DIGEST}" > dist/image-digest.txt
          docker compose -f "dist/${BUNDLE_NAME}" config --quiet
          cd dist
          sha256sum "${BUNDLE_NAME}" image-digest.txt > SHA256SUMS
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: iscsi-reset-service-${{ github.ref_name }}-truenas
          path: |
            dist/${{ env.BUNDLE_NAME }}
            dist/image-digest.txt
            dist/SHA256SUMS
          if-no-files-found: error
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        shell: bash
        run: |
          printf '%s\n' \
            "Container: ${IMAGE_REPOSITORY}@${IMAGE_DIGEST}" \
            "" \
            "The attached TrueNAS YAML already uses this immutable digest." \
            "Replace the management IP and site-specific /mnt/tank paths before installation." \
            > dist/release-notes.md
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" \
              --title "iSCSI Reset Service ${GITHUB_REF_NAME}" \
              --notes-file dist/release-notes.md
            gh release upload "${GITHUB_REF_NAME}" \
              "dist/${BUNDLE_NAME}" dist/image-digest.txt dist/SHA256SUMS --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              "dist/${BUNDLE_NAME}" dist/image-digest.txt dist/SHA256SUMS \
              --verify-tag \
              --title "iSCSI Reset Service ${GITHUB_REF_NAME}" \
              --notes-file dist/release-notes.md
          fi
