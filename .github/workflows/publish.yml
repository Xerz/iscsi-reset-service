name: Publish GHCR image and TrueNAS bundle

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      image_repository: ${{ steps.release.outputs.image_repository }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: release
        name: Validate tag and image repository
        shell: bash
        run: |
          python - <<'PY'
          import os
          import pathlib
          import subprocess
          import tomllib

          def git(*args: str) -> str:
              return subprocess.check_output(["git", *args], text=True).strip()

          ref_name = os.environ["GITHUB_REF_NAME"]
          if os.environ["GITHUB_REF_TYPE"] != "tag":
              raise SystemExit("Release workflow requires a tag ref")

          tag_ref = f"refs/tags/{ref_name}"
          subprocess.run(
              ["git", "fetch", "--force", "origin", f"{tag_ref}:{tag_ref}"],
              check=True,
          )
          if git("cat-file", "-t", tag_ref) != "tag":
              raise SystemExit(f"Tag {ref_name} must be annotated")
          if git("rev-list", "-n", "1", tag_ref) != os.environ["GITHUB_SHA"]:
              raise SystemExit(f"Tag {ref_name} does not point to GITHUB_SHA")
          if not git("for-each-ref", "--format=%(contents)", tag_ref):
              raise SystemExit(f"Annotated tag {ref_name} must contain release highlights")

          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"][
              "version"
          ]
          if ref_name != f"v{version}":
              raise SystemExit(f"Tag {ref_name} does not match project version v{version}")

          owner = os.environ["GITHUB_REPOSITORY_OWNER"].lower()
          with pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write(f"image_repository=ghcr.io/{owner}/iscsi-reset-service\n")
              output.write(f"version={version}\n")
          PY

  verification:
    needs: validate
    uses: ./.github/workflows/verify.yml

  publish:
    needs: [validate, verification]
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
      packages: write
    env:
      BUNDLE_NAME: iscsi-reset-service-${{ github.ref_name }}-truenas.yaml
      IMAGE_REPOSITORY: ${{ needs.validate.outputs.image_repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_REPOSITORY }}
          tags: type=raw,value=${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
      - id: push
        name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          sbom: true
      - name: Attest image provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.IMAGE_REPOSITORY }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Render and validate TrueNAS bundle
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
          PYTHONPATH: src
        shell: bash
        run: |
          python -m iscsi_reset_service.release_bundle \
            --template truenas/custom-app.yaml \
            --output "dist/${BUNDLE_NAME}" \
            --image-repository "${IMAGE_REPOSITORY}" \
            --digest "${IMAGE_DIGEST}"
          printf '%s\n' "${IMAGE_REPOSITORY}@${IMAGE_DIGEST}" > dist/image-digest.txt
          install -m 0644 powershell/*.ps1 dist/
          docker compose -f "dist/${BUNDLE_NAME}" config --quiet
          cd dist
          sha256sum "${BUNDLE_NAME}" image-digest.txt *.ps1 > SHA256SUMS
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: iscsi-reset-service-${{ github.ref_name }}-truenas
          path: |
            dist/${{ env.BUNDLE_NAME }}
            dist/image-digest.txt
            dist/SHA256SUMS
            dist/*.ps1
          if-no-files-found: error
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        shell: bash
        run: |
          tag_ref="refs/tags/${GITHUB_REF_NAME}"
          git fetch --force origin "${tag_ref}:${tag_ref}"
          if [[ "$(git cat-file -t "${tag_ref}")" != "tag" ]]; then
            echo "Tag ${GITHUB_REF_NAME} must be annotated" >&2
            exit 1
          fi
          current_commit="$(git rev-list -n 1 "${GITHUB_REF_NAME}")"
          previous_tag="$(
            git tag --merged "${current_commit}" --sort=-version:refname |
              awk -v current="${GITHUB_REF_NAME}" \
                '$0 ~ /^v[0-9]+\.[0-9]+\.[0-9]+$/ && $0 != current { print; exit }'
          )"
          if [[ -z "${previous_tag}" ]]; then
            echo "No previous semver tag found in ${GITHUB_REF_NAME} history" >&2
            exit 1
          fi

          {
            printf '%s\n\n' "## Что нового"
            git for-each-ref --format='%(contents)' "${tag_ref}"
            printf '\n%s\n\n' "## Коммиты"
            while IFS=$'\t' read -r sha subject; do
              short_sha="${sha:0:7}"
              printf -- '- [`%s`](%s/%s/commit/%s) %s\n' \
                "${short_sha}" "${GITHUB_SERVER_URL}" "${GITHUB_REPOSITORY}" "${sha}" "${subject}"
            done < <(git log --reverse --format='%H%x09%s' "${previous_tag}..${current_commit}")
            printf '\n%s\n\n' "## Комплект выпуска"
            printf '%s\n' \
              "Контейнер: ${IMAGE_REPOSITORY}@${IMAGE_DIGEST}" \
              "" \
              "Скачайте все семь приложенных файлов в один каталог и выполните: \`sha256sum --check SHA256SUMS\`." \
              "Файл \`${BUNDLE_NAME}\` содержит неизменяемый digest образа; перед установкой замените management IP и пути \`/mnt/tank\` для своей системы." \
              "Файл \`image-digest.txt\` содержит полную ссылку на тот же образ, а \`SHA256SUMS\` проверяет YAML, digest-файл и четыре PowerShell-скрипта." \
              "" \
              "Publisher: \`Install-IscsiReleasePublisher.ps1\` и \`Publish-IscsiRelease.ps1\`. Файл \`publisher.json\` скачивается из Management UI своей установки." \
              "Клиент: \`Install-IscsiResetClient.ps1\` и \`Reset-And-Connect.ps1\`."
          } > dist/release-notes.md
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" \
              --title "iSCSI Reset Service ${GITHUB_REF_NAME}" \
              --notes-file dist/release-notes.md
            gh release upload "${GITHUB_REF_NAME}" \
              "dist/${BUNDLE_NAME}" dist/image-digest.txt dist/SHA256SUMS dist/*.ps1 --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              "dist/${BUNDLE_NAME}" dist/image-digest.txt dist/SHA256SUMS dist/*.ps1 \
              --verify-tag \
              --title "iSCSI Reset Service ${GITHUB_REF_NAME}" \
              --notes-file dist/release-notes.md
          fi
