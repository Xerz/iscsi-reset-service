name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[test]'
      - run: ruff check .
      - run: pytest -q --cov=iscsi_reset_service --cov-report=term-missing

  powershell-51:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pester 5.7.1
        shell: powershell
        run: Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
      - name: Test with Windows PowerShell 5.1
        shell: powershell
        run: Invoke-Pester .\powershell\tests -Output Detailed -CI

  interaction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up --build --abort-on-container-exit --exit-code-from windows-simulation
      - if: always()
        run: docker compose down --volumes
