name: Reusable verification

on:
  workflow_call:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[test]'
      - run: ruff check .
      - run: pytest -q --cov=iscsi_reset_service --cov-report=term-missing
      - run: node --check src/iscsi_reset_service/static/app.js
      - run: node tests/static_connection_presentations.test.mjs

  powershell-51:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install Pester 5.7.1
        shell: powershell
        run: Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
      - name: Test with Windows PowerShell 5.1
        shell: powershell
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5 -or $PSVersionTable.PSVersion.Minor -ne 1) {
            throw "Windows PowerShell 5.1 is required for this job"
          }
          $PSVersionTable
          Invoke-Pester .\powershell\tests -Output Detailed -CI

  interaction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up --build --abort-on-container-exit --exit-code-from windows-simulation
      - if: always()
        run: docker compose down --volumes
